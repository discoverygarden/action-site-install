name: Install Drupal
description: Install Drupal using DDEV to test config

inputs:
  aws-role:
    description: The arn of the aws role to use with ecr.
    required: true
  aws-region:
    description: The aws region to use with ecr.
    required: false
    default: us-east-1
  ssh-key:
    description: The ssh key for composer authentication.
    required: false
  composer-auth:
    description: Json formatted composer auth data.
    required: true
  ref:
    description: "The reference at which to test the installation. Defaults according to actions/checkout's ref behavior."
    required: false
    default: ""

runs: 
  using: composite
  steps:
    - name: Checkout PR branch
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
      with:
        role-to-assume: ${{ inputs.aws-role }}
        aws-region: ${{ inputs.aws-region }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      
    - name: Setup Composer auth.json
      shell: bash
      run: |
        mkdir -p .ddev/homeadditions/.composer
        echo '${{ inputs.composer-auth }}' > .ddev/homeadditions/.composer/auth.json

    - name: Setup Composer ssh keys
      if:  inputs.ssh-key
      shell: bash
      run: |
        mkdir -p .ddev/homeadditions/.ssh
        echo "${{ inputs.ssh-key }}" > .ddev/homeadditions/.ssh/id_rsa
        chmod 700 .ddev/homeadditions/.ssh
        chmod 600 .ddev/homeadditions/.ssh/id_rsa

    - name: Setup DDEV
      uses: ddev/github-action-setup-ddev@fdf2f5c97943bae638f31df6df86f1defa6210c0 # v1.12.1
      with:
        # XXX: The default `https://ddev.com/install.sh` started 504ing.
        installScriptUrl: "https://raw.githubusercontent.com/ddev/ddev/main/scripts/install_ddev.sh"

    - name: Install unupdated site
      shell: bash
      run: |
        set -e
        ddev composer install
        ddev install-site 
